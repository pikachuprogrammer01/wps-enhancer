name: Release

# 推送 v* 标签（如 v1.1.0）时自动打包并发布到 GitHub Releases（macOS + Windows）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (macOS)
        run: |
          cd dist && zip -r "WPS增强工具-macOS.zip" "WPS增强工具.app"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WPS增强工具-macOS.zip
          generate_release_notes: true

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build app (Windows)
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (Windows)
        shell: powershell
        run: |
          Compress-Archive -Path dist/WPS增强工具/* -DestinationPath dist/WPS增强工具-Windows.zip

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WPS增强工具-Windows.zip
          generate_release_notes: true
