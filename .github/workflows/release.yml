name: Release

# 自动发布：推送 v* 标签（如 v1.1.0）时构建 macOS + Windows 双版本并上传 Releases
# 也可手动触发（Actions 页面 → Run workflow）测试构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布标签名（手动触发时使用，如 v1.0.0-test）'
        required: false
        default: 'v-test-build'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 全量历史：changelog 需要完整区间（浅克隆下 git log 只剩 tag 自身 commit）
          fetch-depth: 0

      - name: Verify version consistency
        # 强制 tag 与 core/version.py 一致：tag v1.0.1 必须对应 APP_VERSION=1.0.1，
        # 否则客户端「已是最新版本」判断会因本地版本高于云端而永远不提示更新
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(python3 -c "from core.version import APP_VERSION; print(APP_VERSION)")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::版本不一致：tag=${TAG}，但 core/version.py 的 APP_VERSION=${ACTUAL}。请先修改版本号并推送后再打 tag 发布。"
            exit 1
          fi
          echo "版本一致 ✓ tag=${TAG} APP_VERSION=${ACTUAL}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (macOS)
        run: |
          cd dist
          # 资产名带架构（runner 架构 = 产物架构，动态获取不假设）
          # -y 保留 symlink 不复制目标：否则 Qt framework 的 49 个 symlink 被解引用，包体膨胀 4-5 倍
          ARCH=$(uname -m)
          zip -r -y "WPSEnhancer-macOS-${ARCH}.zip" "WPS增强工具.app"

      - name: Generate changelog body
        # Release 描述 = 本次增量 changelog + 旧描述（合并，不替换）。
        # 增量区间：当前 tag 的父链上最近 tag（git describe，不取版本号
        # 最大的 tag——force 移动后它会指错，曾致描述只剩几行）；
        # 无父 tag（首个版本/tag 重建）→ 全量（相对完整的功能列表）。
        # 仅用户可见变更进描述：feat/fix；ci/chore/docs/build 自动过滤。
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          # 父版本判定（三层）：
          # 1. 当前 tag 的父链上最近 tag（git describe，最准确）
          # 2. 回退：版本号最大的其他 tag（describe 失败时，如 main 链无 tag）
          # 3. 祖先校验：merge-base 必须是 PREV 本身（PREV 为 TAG 祖先）才走
          #    增量区间；否则（PREV 是后代/无关，如 tag 重建场景）→ 全量，
          #    避免区间错乱导致描述只剩几行
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          fi
          if [ -n "$PREV" ] && \
             [ "$(git merge-base "$PREV" "$TAG")" = "$(git rev-parse "$PREV")" ]; then
            RANGE="$PREV..$TAG"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"  # 首版/重建：全量
          fi
          # 先取 %s → 仅按 subject 过滤（--grep 会匹配 message 全文，
          # body 中含"feat 开头"的行会污染列表）→ 过滤构建类 scope → 按标题去重
          FEAT=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep "^feat" | grep -vE "^feat\((ci|build|workflow|release)\)" | awk '!seen[$0]++ {print "- " $0}' || true)
          FIX=$(git log "$RANGE" --pretty=format:"%s" --no-merges | grep "^fix" | grep -vE "^fix\((ci|build|workflow|release)\)" | awk '!seen[$0]++ {print "- " $0}' || true)
          BODY=""
          if [ -n "$FEAT" ]; then printf -v BODY '%s## ✨ 新特性\n\n%s\n\n' "$BODY" "$FEAT"; fi
          if [ -n "$FIX" ]; then printf -v BODY '%s## 🐛 问题修复\n\n%s\n\n' "$BODY" "$FIX"; fi
          if [ -z "$BODY" ]; then BODY="本次更新无用户可见变更。"; fi
          # 合并旧描述（须在 Cleanup 删除 Release 之前读取）：
          # 增量模式（有真实父版本）→ 旧描述追加在后（不替换，历史不丢）；
          # 全量模式（首版/重建）→ 全量已含全部历史，不拼接避免重复。
          PREV_BODY=$(gh release view "$TAG" --json body -q .body 2>/dev/null || true)
          if [ "$RANGE" = "$PREV..$TAG" ] && [ -n "$PREV_BODY" ]; then
            printf -v BODY '%s\n---\n\n%s' "$BODY" "$PREV_BODY"
          fi
          echo "BODY_LEN=${#BODY}"  # 诊断输出（日志可查）
          EOF=$(openssl rand -hex 16)
          {
            echo "body<<$EOF"
            echo "$BODY"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup existing release
        # 根治旧资产混入：发布前删除同名旧 Release（资产随 Release 删除），从零重建
        # 必须在 Generate changelog 之后：旧描述需在删除前读取（合并用）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true

      - name: Publish Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPSEnhancer-macOS-*.zip
          body: ${{ steps.changelog.outputs.body }}

  build-windows:
    # 串行依赖 macOS job：确保 Release 先由 macOS job 创建，Windows 只附加资产（避免并发竞态）
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 完整历史：update.json 的 notes 需计算上 tag..HEAD 的 changelog，
          # 浅克隆下 git log 区间为空（v1.0.3 发布时 notes 为空的根因）
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app (Windows)
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (Windows)
        shell: powershell
        run: |
          # 资产名带架构（windows-latest 为 x64，动态获取不假设）
          # WOW64 下 32 位 PowerShell 的 PROCESSOR_ARCHITECTURE 是 x86，
          # 须优先取 PROCESSOR_ARCHITEW6432 判断真实架构
          $envarch = if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }
          $arch = switch ($envarch) {
              'AMD64' { 'x86_64' }
              'ARM64' { 'arm64' }
              default { 'x86' }
          }
          Compress-Archive -Path dist/WPSEnhancer/* -DestinationPath "dist/WPSEnhancer-Windows-$arch.zip"

      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPSEnhancer-Windows-*.zip

      # —— GitHub × Gitee 联动：自动生成 update.json 并推回 main ——
      # Gitee 镜像仓库会同步 main 分支，app 的自定义更新源指向
      # Gitee raw 的 update.json 即可用国内可达地址检查/下载更新。
      - name: Generate update.json and push to main
        shell: bash
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git fetch origin --tags
          git checkout -b update-main origin/main
          # 更新说明取本次发布增量 changelog（前 800 字符；父版本判定与
          # Release 描述一致：describe → 版本号最大回退 → merge-base 祖先
          # 校验，不满足时全量兜底）
          NOTES=""
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV" ]; then
            PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          fi
          if [ -n "$PREV" ] && \
             [ "$(git merge-base "$PREV" HEAD)" = "$(git rev-parse "$PREV")" ]; then
            RANGE="$PREV..HEAD"
          else
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          fi
          NOTES=$(git log "$RANGE" --pretty=format:"%s" --grep="^feat" --grep="^fix" --no-merges | awk '!seen[$0]++ {print "- " $0}' || true)
          python3 - "$TAG" "$REPO" "$NOTES" <<'PYEOF'
          import json, sys
          tag, repo, notes = sys.argv[1], sys.argv[2], sys.argv[3][:800]
          data = {
              "version": tag,
              "urls": {
                  "macos-arm64": f"https://github.com/{repo}/releases/download/{tag}/WPSEnhancer-macOS-arm64.zip",
                  "macos-x86_64": f"https://github.com/{repo}/releases/download/{tag}/WPSEnhancer-macOS-x86_64.zip",
                  "windows-x86_64": f"https://github.com/{repo}/releases/download/{tag}/WPSEnhancer-Windows-x86_64.zip",
                  "windows-x86": f"https://github.com/{repo}/releases/download/{tag}/WPSEnhancer-Windows-x86.zip",
              },
              "notes": notes,
          }
          with open("update.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          PYEOF
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json 无变化，跳过推送"
          else
            git commit -m "chore(update): 发布 ${TAG}，更新 update.json"
            git push origin HEAD:main
            echo "update.json 已推送（Gitee 镜像将自动同步）"
          fi
