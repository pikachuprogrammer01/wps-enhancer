name: Release

# 自动发布：推送 v* 标签（如 v1.1.0）时构建 macOS + Windows 双版本并上传 Releases
# 也可手动触发（Actions 页面 → Run workflow）测试构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布标签名（手动触发时使用，如 v1.0.0-test）'
        required: false
        default: 'v-test-build'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (macOS)
        run: |
          cd dist && zip -r "WPS增强工具-macOS.zip" "WPS增强工具.app"

      - name: Publish Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPS增强工具-macOS.zip
          generate_release_notes: true

  build-windows:
    # 串行依赖 macOS job：确保 Release 先由 macOS job 创建，Windows 只附加资产（避免并发竞态）
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app (Windows)
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (Windows)
        shell: powershell
        run: |
          Compress-Archive -Path dist/WPS增强工具/* -DestinationPath dist/WPS增强工具-Windows.zip

      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPS增强工具-Windows.zip
          generate_release_notes: true
