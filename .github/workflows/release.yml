name: Release

# 自动发布：推送 v* 标签（如 v1.1.0）时构建 macOS + Windows 双版本并上传 Releases
# 也可手动触发（Actions 页面 → Run workflow）测试构建
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布标签名（手动触发时使用，如 v1.0.0-test）'
        required: false
        default: 'v-test-build'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version consistency
        # 强制 tag 与 core/version.py 一致：tag v1.0.1 必须对应 APP_VERSION=1.0.1，
        # 否则客户端「已是最新版本」判断会因本地版本高于云端而永远不提示更新
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          EXPECTED="${TAG#v}"
          ACTUAL=$(python3 -c "from core.version import APP_VERSION; print(APP_VERSION)")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::版本不一致：tag=${TAG}，但 core/version.py 的 APP_VERSION=${ACTUAL}。请先修改版本号并推送后再打 tag 发布。"
            exit 1
          fi
          echo "版本一致 ✓ tag=${TAG} APP_VERSION=${ACTUAL}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (macOS)
        run: |
          cd dist
          # 资产名带架构（runner 架构 = 产物架构，动态获取不假设）
          # -y 保留 symlink 不复制目标：否则 Qt framework 的 49 个 symlink 被解引用，包体膨胀 4-5 倍
          ARCH=$(uname -m)
          zip -r -y "WPSEnhancer-macOS-${ARCH}.zip" "WPS增强工具.app"

      - name: Cleanup existing release
        # 根治旧资产混入：发布前删除同名旧 Release（资产随 Release 删除），从零重建
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true

      - name: Generate changelog body
        # 从上一个 tag 到当前 tag 的 commit 自动生成 Release 描述（conventional commits 分节）
        id: changelog
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          PREV=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..$TAG"
          else
            RANGE="HEAD"  # 首个发布：取全部提交
          fi
          FEAT=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --no-merges || true)
          FIX=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix" --no-merges || true)
          OTHER=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --grep="^fix" --invert-grep --no-merges || true)
          BODY=""
          if [ -n "$FEAT" ]; then printf -v BODY '%s## ✨ 新特性\n\n%s\n\n' "$BODY" "$FEAT"; fi
          if [ -n "$FIX" ]; then printf -v BODY '%s## 🐛 问题修复\n\n%s\n\n' "$BODY" "$FIX"; fi
          if [ -n "$OTHER" ]; then printf -v BODY '%s## 🔧 其他变更\n\n%s\n' "$BODY" "$OTHER"; fi
          if [ -z "$BODY" ]; then BODY="无变更记录。"; fi
          EOF=$(openssl rand -hex 16)
          {
            echo "body<<$EOF"
            echo "$BODY"
            echo "$EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Release (macOS)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPSEnhancer-macOS-*.zip
          body: ${{ steps.changelog.outputs.body }}

  build-windows:
    # 串行依赖 macOS job：确保 Release 先由 macOS job 创建，Windows 只附加资产（避免并发竞态）
    needs: build-macos
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build app (Windows)
        run: |
          python -m PyInstaller "WPS增强工具.spec" --noconfirm

      - name: Package zip (Windows)
        shell: powershell
        run: |
          # 资产名带架构（windows-latest 为 x64，动态获取不假设）
          # WOW64 下 32 位 PowerShell 的 PROCESSOR_ARCHITECTURE 是 x86，
          # 须优先取 PROCESSOR_ARCHITEW6432 判断真实架构
          $envarch = if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }
          $arch = switch ($envarch) {
              'AMD64' { 'x86_64' }
              'ARM64' { 'arm64' }
              default { 'x86' }
          }
          Compress-Archive -Path dist/WPSEnhancer/* -DestinationPath "dist/WPSEnhancer-Windows-$arch.zip"

      - name: Publish Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: dist/WPSEnhancer-Windows-*.zip
