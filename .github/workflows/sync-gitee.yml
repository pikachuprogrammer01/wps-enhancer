name: Sync to Gitee

# GitHub × Gitee 联动：main 有任何推送（含 CI 自动生成的 update.json），
# 立即同步到 Gitee 镜像仓库——无需手动点「立即同步」，无需等镜像频率。
# 依赖：GitHub 仓库 Secret GITEE_TOKEN（Gitee 私人令牌，scope: projects）。
# 配置方法见 README「GitHub × Gitee 联动」。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 GITEE_TOKEN，跳过 Gitee 同步（配置方法见 README）"
            exit 0
          fi
          # Gitee HTTPS 认证：用户名:私人令牌（Basic Auth，令牌当密码）。
          # 注意：oauth2:<token> 是 GitLab 写法，Gitee 官方文档不支持。
          git remote add gitee "https://pikachuprogrammer01:${GITEE_TOKEN}@gitee.com/pikachuprogrammer01/wps-enhancer.git"
          # 先 fetch 建立 gitee/main 远程跟踪——--force-with-lease 在无跟踪
          # 信息时必然拒绝（stale info），这是首次同步失败的根因
          git fetch gitee main || echo "（Gitee 无 main 或首次连接，继续）"
          # force-with-lease：以刚 fetch 的状态为基准，Gitee 侧如有更新会拒绝
          git push gitee main --force-with-lease
          echo "已同步到 Gitee：$(git rev-parse --short HEAD)"
